kotlin = "2.0.0"
ksp = "2.0.0-1.0.21"
kapt = "2.6.1"
room = "2.7.2"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
coreSplashscreen = "1.0.1"
compose = "1.7.8"
composeBom = "2025.01.01"
material3 = "1.3.2"
navigationCompose = "2.9.1"
appcompat = "1.7.1"
